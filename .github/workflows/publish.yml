name: Publish TON Payment API

on:
  push:
    branches: [master]
    paths:
      - 'apps/ton-payment/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '.github/workflows/publish-payment.yml'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: username/ton-payment-api

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: clayzenx
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/ton-payment/Dockerfile
          push: true
          tags: ghcr.io/${{ env.IMAGE_NAME }}:latest

